<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Manahil 💖</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #ffffff;
            --accent-color: #4facfe;
            --cake-blue: #4d7cfe;
            --frosting: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            transition: background 1s ease;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 1s ease;
            opacity: 0;
            pointer-events: none;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        #screen-start .start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
            animation: pulse 2s infinite;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 70vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .flower-svg {
            width: 300px;
            height: 400px;
            opacity: 0;
            transform: translateY(50px);
            transition: all 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .flower-svg.grow {
            opacity: 1;
            transform: translateY(0);
        }

        .heart-btn {
            position: absolute;
            top: 10%;
            background: none;
            border: none;
            font-size: 4rem;
            cursor: pointer;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s ease;
            z-index: 20;
            filter: drop-shadow(0 0 10px #ff416c);
        }

        .heart-btn.show {
            opacity: 1;
            transform: scale(1);
            animation: beat 1.2s infinite;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            30% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        .princess-text {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 600;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 1s ease;
        }

        .princess-text.show {
            opacity: 1;
            transform: translateY(0);
        }

        .cake-wrapper {
            position: relative;
            width: 250px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .cake-base {
            width: 220px;
            height: 80px;
            background: var(--frosting);
            border-radius: 0 0 15px 15px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s ease;
        }

        .cake-base.show {
            opacity: 1;
            transform: scale(1);
        }

        .cream-coating {
            width: 220px;
            height: 25px;
            background: var(--cake-blue);
            border-radius: 15px 15px 0 0;
            position: absolute;
            top: -20px;
            left: 0;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.6s ease 0.5s;
        }

        .cream-coating::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 12px;
            background-image: radial-gradient(circle at 11px 0, var(--cake-blue) 12px, transparent 13px);
            background-size: 22px 20px;
            top: 24px;
        }

        .cream-coating.show {
            opacity: 1;
            transform: translateY(0);
        }

        .cake-face {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .eyes {
            display: flex;
            gap: 40px;
            opacity: 0;
            transform: scaleX(0);
            transition: all 0.5s ease 1.2s;
        }

        .eyes.show {
            opacity: 1;
            transform: scaleX(1);
        }

        .eye {
            width: 15px;
            height: 15px;
            background: #000;
            border-radius: 50%;
        }

        .smile {
            width: 25px;
            height: 12px;
            border: 3px solid #000;
            border-top: none;
            border-radius: 0 0 15px 15px;
            margin-top: 5px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease 1.5s;
        }

        .smile.show {
            opacity: 1;
            transform: translateY(0);
        }

        .candles-container {
            display: flex;
            gap: 20px;
            position: absolute;
            top: -45px;
        }

        .candle {
            width: 8px;
            height: 30px;
            background: linear-gradient(to right, #e6e6e6, #ffffff);
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .candle.show {
            opacity: 1;
            transform: translateY(0);
        }

        .flame {
            width: 10px;
            height: 15px;
            background: #ff9800;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -16px;
            left: -1px;
            opacity: 0;
            transition: opacity 0.5s ease;
            box-shadow: 0 0 10px #ff9800, 0 0 20px #ff5722;
        }

        .flame.lit {
            opacity: 1;
            animation: flicker 0.1s ease infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1); }
            100% { transform: scale(1.1) rotate(2deg); }
        }

        .continue-btn {
            margin-top: 40px;
            padding: 10px 25px;
            background: #4facfe;
            border: none;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .continue-btn.show {
            opacity: 1;
        }

        .balloon-instruction {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .balloons-area {
            display: flex;
            gap: 30px;
            height: 250px;
            align-items: flex-end;
        }

        .balloon-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .balloon-box:hover {
            transform: translateY(-10px);
        }

        .balloon {
            width: 60px;
            height: 75px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -6px;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 6px solid;
        }

        .balloon-string {
            width: 2px;
            height: 60px;
            background: rgba(255,255,255,0.4);
        }

        .b-word {
            margin-top: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }

        .b-word.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        .special-typing-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff4b2b;
            text-shadow: 0 0 15px rgba(255,75,43,0.4);
            margin-top: 20px;
            min-height: 50px;
        }

        .bouquet-title {
            font-size: 1.8rem;
<body>

    <div class="screen active" id="screen-start">
        <button class="start-btn" onclick="startSurprise()">Tap to Open Your Surprise ✨</button>
    </div>

    <div class="screen" id="screen-flower">
        <button class="heart-btn" id="heartBtn" onclick="nextScreen(1)">❤️</button>
        <div class="canvas-container">
            <svg class="flower-svg" id="flowerSvg" viewBox="0 0 100 120">
                <path d="M50,120 Q50,70 50,25" stroke="#00b894" stroke-width="2" fill="none" />
                <path d="M50,120 Q35,80 25,45" stroke="#00b894" stroke-width="1.5" fill="none" />
                <path d="M50,120 Q65,85 75,50" stroke="#00b894" stroke-width="1.5" fill="none" />
                <path d="M50,90 Q30,85 20,70 Q35,75 50,90" fill="#00b894" />
                <path d="M50,80 Q70,75 80,60 Q65,65 50,80" fill="#00b894" />
                <path d="M50,105 Q25,100 15,90 Q30,95 50,105" fill="#00b894" />
                <circle cx="25" cy="45" r="10" fill="#55efc4" opacity="0.8" filter="drop-shadow(0 0 5px #55efc4)" />
                <circle cx="25" cy="45" r="5" fill="#fff" />
                <circle cx="75" cy="50" r="10" fill="#55efc4" opacity="0.8" filter="drop-shadow(0 0 5px #55efc4)" />
                <circle cx="75" cy="50" r="5" fill="#fff" />
                <circle cx="50" cy="25" r="14" fill="#81ecec" opacity="0.8" filter="drop-shadow(0 0 8px #81ecec)" />
                <circle cx="50" cy="25" r="7" fill="#fff" />
            </svg>
        </div>
    </div>

    <div class="screen" id="screen-cake">
        <div class="princess-text" id="princessText">To the prettiest princess in the world 🎊💝🎊</div>
        <div class="cake-wrapper">
            <div class="candles-container">
                <div class="candle" id="c1"><div class="flame"></div></div>
                <div class="candle" id="c2"><div class="flame"></div></div>
                <div class="candle" id="c3"><div class="flame"></div></div>
            </div>
            <div class="cake-base" id="cakeBase">
                <div class="cream-coating" id="cakeCream"></div>
                <div class="cake-face">
                    <div class="eyes" id="cakeEyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="smile" id="cakeSmile"></div>
                </div>
            </div>
        </div>
        <button class="continue-btn" id="cakeContinue" onclick="nextScreen(2)">Continue ➡️</button>
    </div>

    <div class="screen" id="screen-balloons">
        <div class="balloon-instruction" id="bInstr">🎈 Pop all the balloons in sequence! 🎈</div>
        <div class="balloons-area" id="balloonsArea">
            <div class="balloon-box" onclick="popBalloon(1, this)">
                <div class="balloon" style="background-color: #ff7675;">1</div>
                <div class="balloon-string"></div>
                <div class="b-word">You</div>
            </div>
            <div class="balloon-box" onclick="popBalloon(2, this)">
                <div class="balloon" style="background-color: #74b9ff;">2</div>
                <div class="balloon-string"></div>
                <div class="b-word">Are</div>
            </div>
            <div class="balloon-box" onclick="popBalloon(3, this)">
                <div class="balloon" style="background-color: #a29bfe;">3</div>
                <div class="balloon-string"></div>
                <div class="b-word">So</div>
            </div>
            <div class="balloon-box" onclick="popBalloon(4, this)">
                <div class="balloon" style="background-color: #fdcb6e;">4</div>
                <div class="balloon-string"></div>
                <div class="b-word">Special</div>
            </div>
        </div>
        <div class="special-typing-text" id="typingTarget"></div>
        <div class="btn-container">
            <button class="continue-btn" id="balloonContinue" onclick="nextScreen(3)">Continue ➡️</button>
        </div>
    </div>

    <div class="screen" id="screen-bouquet" style="background-color: #faf3f3; color: #2c3e50;">
        <div class="bouquet-title">Your Rose Bouquet 🌹</div>
        <svg class="bouquet-img" id="bouquetImg" viewBox="0 0 100 100">
            <path d="M50,90 L35,50 L65,50 Z" fill="#d1ccc0" />
            <circle cx="42" cy="45" r="10" fill="#ff7675" />
            <circle cx="58" cy="45" r="10" fill="#d63031" />
            <circle cx="50" cy="35" r="12" fill="#ff4d4d" />
            <circle cx="35" cy="35" r="8" fill="#c0392b" />
            <circle cx="65" cy="35" r="8" fill="#e74c3c" />
            <path d="M45,50 Q50,60 55,50" fill="none" stroke="#b2bec3" stroke-width="2" />
            <path d="M38,52 L62,52 L50,65 Z" fill="#ff7675" />
        </svg>
        <button class="continue-btn" id="bouquetContinue" style="opacity:1; margin-top:20px;" onclick="nextScreen(4)">Continue ➡️</button>
    </div>

    <div class="screen" id="screen-envelope" style="background-color: #faf3f3;">
        <div class="envelope-container" id="envelope" onclick="openEnvelope()">
            <div class="envelope-flap"></div>
            <div class="envelope-text">A Message From My Heart ❤️</div>
        </div>
    </div>

    <div class="screen" id="screen-letter">
        <div class="letter-content" id="letterContent">
            
            <div class="letter-section">
                <div class="section-title">🚨 The "Keera" Birthday Warning! 🐜</div>
                <p><strong>Alert! Alert! 🚨</strong></p>
                <p>My internal 'Keera' (the big one inside me) woke up today and gave me a serious warning: <em>"Hey you big donkey, wake up! It’s 22nd of November, the birthday of the prettiest princess in the world, Manahil! Do something magical right now!"</em> So yeah... you can completely blame my inner keera for this whole surprise! 😜</p>
            </div>

            <div class="letter-section">
                <div class="section-title">💘 The Direct Confession</div>
                <div class="highlight-box">
                    You always tell me, "Aap se baat ho jati hai to kuch aur na smjhein..." But Manahil, today on your special day, I want to be 100% direct. No more indirect hints, no more hiding behind jokes. 
                    <br><br>
                    The truth is... <strong>I like you. Very, very, VERY much. 🥰❣️🥰</strong> You are the absolute rarest, most beautiful, and most special person in my life.
                </div>
            </div>

            <div class="letter-section">
                <div class="section-title">👑 To The Prettiest Princess</div>
                <p><strong>Assalam-o-Alaikum Manahil, my prettiest Princess,</strong></p>
                <p>First of all, <strong>Happy Birthday to you! 🎉🎁✨</strong> May this year bring endless smiles, joy, and blessings into your life.</p>
                <p>I might not always have the perfect words, and you might call me a total donkey (Gadha), but to me, you are the most beautiful person in this entire universe. You are like a fairy—a heavenly Hoor who just walked into my world and made everything ten times brighter. You have this magical charm that completely melts me, even when you are just teasing me, hiding behind your aura, or being shy.</p>
                <p>I feel incredibly lucky just to have you to talk to. Thank you for being your unique, amazing, and beautiful self. Never change your aura, because you look best acting like my queen.</p>
                <p>Happy Birthday once again, my favorite human. Always smiling, always shining! ✨</p>
                <br>
                <p style="font-weight: bold; color: #ff416c; text-align: right;">With all my heart,<br>Your Favorite 'Gadha' / 'Keera' 🫏❤️</p>
            </div>

        </div>
    </div>

    <script>
        const BACKGROUND_MUSIC_URL = "YOUR_DIRECT_MP3_URL_HERE"; 
        
        const audio = new Audio(BACKGROUND_MUSIC_URL);
        audio.loop = true;

        const screens = [
            document.getElementById('screen-start'),
            document.getElementById('screen-flower'),
            document.getElementById('screen-cake'),
            document.getElementById('screen-balloons'),
            document.getElementById('screen-bouquet'),
            document.getElementById('screen-envelope'),
            document.getElementById('screen-letter')
        ];

        let currentScreenIdx = 0;
        let ambientInterval;

        function startSurprise() {
            audio.play().catch(e => console.log("Audio waiting for interaction"));
            nextScreen(0);
            runFlowerSequence();
        }

        function nextScreen(currentIdx) {
            screens[currentIdx].classList.remove('active');
            currentScreenIdx = currentIdx + 1;
            screens[currentScreenIdx].classList.add('active');
            
            clearInterval(ambientInterval);
            if (currentScreenIdx === 1) {
                startAmbientEffects('✨', '#81ecec');
            } else if (currentScreenIdx === 2) {
                startAmbientEffects('❄️', '#74b9ff');
            } else if (currentScreenIdx === 3 || currentScreenIdx === 4) {
                startAmbientEffects('🌹', '#ff7675');
            }
        }

        function runFlowerSequence() {
            setTimeout(() => {
                document.getElementById('flowerSvg').classList.add('grow');
                setTimeout(() => {
                    document.getElementById('heartBtn').classList.add('show');
                }, 2000);
            }, 300);
        }

        window.addEventListener('click', () => {
            if(currentScreenIdx === 2 && !document.getElementById('cakeBase').classList.contains('show')) {
                triggerCakeSequence();
            }
        });

        function triggerCakeSequence() {
            document.getElementById('cakeBase').classList.add('show');
            document.getElementById('cakeCream').classList.add('show');
            
            setTimeout(() => document.getElementById('cakeEyes').classList.add('show'), 1500);
            setTimeout(() => document.getElementById('cakeSmile').classList.add('show'), 2000);
            
            setTimeout(() => document.getElementById('c1').classList.add('show'), 2600);
            setTimeout(() => document.getElementById('c2').classList.add('show'), 3000);
            setTimeout(() => document.getElementById('c3').classList.add('show'), 3400);
            
            setTimeout(() => {
                document.querySelectorAll('.flame').forEach(f => f.classList.add('lit'));
                document.body.style.backgroundColor = '#05070c';
                document.getElementById('princessText').classList.add('show');
                document.getElementById('cakeContinue').classList.add('show');
            }, 4200);
        }

        let expectedPop = 1;
        function popBalloon(num, element) {
            if(num === expectedPop) {
                element.querySelector('.balloon').style.visibility = 'hidden';
                element.querySelector('.balloon-string').style.visibility = 'hidden';
                element.querySelector('.b-word').classList.add('reveal');
                expectedPop++;
                
                if(expectedPop > 4) {
                    triggerTypingFinale();
                }
            }
        }

        function triggerTypingFinale() {
            document.getElementById('bInstr').style.display = 'none';
            document.body.style.background = 'radial-gradient(circle, #1a0812 0%, #050206 100%)';
            
            const text = "You are so special...";
            let i = 0;
            const target = document.getElementById('typingTarget');
            
            function type() {
                if (i < text.length) {
                    target.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 150);
                } else {
                    document.getElementById('balloonContinue').classList.add('show');
                }
            }
            setTimeout(type, 500);
        }

        setInterval(() => {
            if(currentScreenIdx === 4) {
                document.getElementById('bouquetImg').classList.add('show');
            }
        }, 300);

        function openEnvelope() {
            const env = document.getElementById('envelope');
            env.classList.add('open');
            setTimeout(() => {
                nextScreen(5);
                setTimeout(() => {
                    document.getElementById('letterContent').classList.add('show');
                }, 400);
            }, 1000);
        }

        function startAmbientEffects(symbol, color) {
            ambientInterval = setInterval(() => {
                const element = document.createElement('div');
                element.className = 'sparkle';
                element.innerText = symbol;
                element.style.left = Math.random() * 100 + 'vw';
                element.style.fontSize = (Math.random() * 20 + 15) + 'px';
                element.style.animationDuration = (Math.random() * 3 + 3) + 's';
                element.style.color = color;
                document.body.appendChild(element);
                
                setTimeout(() => { element.remove(); }, 5000);
            }, 300);
        }
    </script>
</body>
</html>
